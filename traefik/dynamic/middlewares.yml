http:
  middlewares:
    packyard-auth:
      forwardAuth:
        address: "http://auth:8080/auth"
        authRequestHeaders:
          - "Authorization"
        trustForwardHeader: false
        # authResponseHeaders omitted — auth service returns no headers to pass downstream
        # fail-closed: Traefik returns 503 if auth service is unreachable (NFR11)

    packyard-strip-deb:
      stripPrefix:
        prefixes:
          - "/deb"
        # nginx serves aptly's publish tree at its root, so /deb/<component>/<series>/
        # becomes /<component>/<series>/. Applied AFTER packyard-auth, which needs
        # the full path for component scope enforcement.

    packyard-v2-to-oci:
      replacePathRegex:
        regex: '^/v2/oci/(.*)'
        replacement: '/oci/v2/$1'
        # Docker-style registry references put the /oci path element inside
        # the repository name; forward-auth expects it before /v2/.

    packyard-strip-oci:
      stripPrefix:
        prefixes:
          - "/oci"
        # Strips /oci before forwarding to Zot — must be applied AFTER packyard-auth
        # so forwardAuth sees full /oci/v2/... path for component scope enforcement
