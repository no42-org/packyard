http:
  middlewares:
    packyard-auth:
      forwardAuth:
        address: "http://auth:8080/auth"
        authRequestHeaders:
          - "Authorization"
        # The entryPoint sanitises X-Forwarded-* from every client not listed in
        # forwardedHeaders.trustedIPs, and no entryPoint here lists any, so
        # nothing a client sends survives to this middleware. What reaches the
        # auth service is Traefik's own header set, which is what `true` trusts.
        # `false` is deprecated since 3.6.14, the release that patched
        # GHSA-6384-m2mw-rf54: it forwarded a client's X-Forwarded-Prefix
        # untouched. Leaving the option unset logs a warning on every start.
        trustForwardHeader: true
        # authResponseHeaders omitted — auth service returns no headers to pass downstream
        # fail-closed: Traefik returns 503 if auth service is unreachable (NFR11)

    packyard-strip-deb:
      stripPrefix:
        prefixes:
          - "/deb"
        # nginx serves aptly's publish tree at its root, so /deb/<component>/<series>/
        # becomes /<component>/<series>/. Applied AFTER packyard-auth, which needs
        # the full path for component scope enforcement.

    packyard-v2-to-oci:
      replacePathRegex:
        regex: '^/v2/oci/(.*)'
        replacement: '/oci/v2/$1'
        # Docker-style registry references put the /oci path element inside
        # the repository name; forward-auth expects it before /v2/.

    packyard-strip-oci:
      stripPrefix:
        prefixes:
          - "/oci"
        # Strips /oci before forwarding to Zot — must be applied AFTER packyard-auth
        # so forwardAuth sees full /oci/v2/... path for component scope enforcement
