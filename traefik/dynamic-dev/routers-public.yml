http:
  routers:
    # Dev override: PathPrefix-only rules — no Host() check.
    # Services are reachable by IP or localhost without DNS or a Host header.
    # TLS uses Traefik's self-signed fallback (LE cannot issue for localhost/IP).
    # Use curl -k or add Traefik's dev cert to your trust store.

    # Category ② — public-unauthenticated (no forwardAuth)
    gpg-public:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/gpg/`)"
      service: packyard-static-svc
      tls: {}

    # Category ① — public-authenticated (forwardAuth required)
    rpm-authenticated:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/rpm/`)"
      middlewares:
        - packyard-auth
      service: packyard-rpm-svc
      tls: {}

    deb-authenticated:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/deb/`)"
      middlewares:
        - packyard-auth       # MUST be first — forwardAuth sees the full /deb/<component>/... path
        - packyard-strip-deb
      service: packyard-deb-svc
      tls: {}

    # Subscribers only read. Forward-auth allows every method on a public
    # component and Zot enforces nothing itself, so write methods must not
    # reach the registry: they match no router here and get 404. Promotions
    # push to Zot on its loopback port and never traverse these routers.
    oci-authenticated:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/oci/`) && (Method(`GET`) || Method(`HEAD`))"
      middlewares:
        - packyard-auth       # MUST be first — forwardAuth sees full /oci/v2/... for scope check
        - packyard-strip-oci  # MUST be second — strips /oci before Zot receives request
      service: packyard-zot-svc
      tls: {}

    # docker, crane and cosign address a registry at /v2/ on the host root, so
    # the documented reference <host>/oci/lts-<component>/<image> arrives as
    # /v2/oci/lts-<component>/<image>/... Rewrite it to the /oci/v2/... shape
    # forward-auth scopes on, then strip /oci for Zot like the /oci/ router.
    # The bare /v2/ ping is left alone and answers 401 from forward-auth,
    # which anonymous clients accept.
    oci-v2-authenticated:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/v2/`) && (Method(`GET`) || Method(`HEAD`))"
      middlewares:
        - packyard-v2-to-oci  # MUST be first — turns /v2/oci/... into /oci/v2/...
        - packyard-auth       # sees the rewritten /oci/v2/lts-<component>/... path
        - packyard-strip-oci  # Zot receives /v2/lts-<component>/...
      service: packyard-zot-svc
      tls: {}

  services:
    packyard-static-svc:
      loadBalancer:
        servers:
          - url: "http://static:8080"

    packyard-rpm-svc:
      loadBalancer:
        servers:
          - url: "http://rpm:8080"

    packyard-deb-svc:
      loadBalancer:
        servers:
          - url: "http://deb:8080"

    packyard-zot-svc:
      loadBalancer:
        servers:
          - url: "http://zot:5000"
