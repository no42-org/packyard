api:
  dashboard: false

log:
  level: INFO

accessLog:
  fields:
    names:
      ClientUsername: drop          # C3 — drop key username from access log records (NFR5)
    headers:
      defaultMode: keep
      names:
        Authorization: redact       # C3 — mask subscription key value in logs (NFR5)

entryPoints:
  websecure:
    address: "0.0.0.0:443"
  admin:
    address: "127.0.0.1:8443"

certificatesResolvers:
  letsencrypt:
    acme:
      # email is set via TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL in compose.yml.
      # Static config does not expand ${VAR}; the TRAEFIK_ env var prefix is the correct mechanism.
      # Expected format: a valid RFC 5321 address, e.g. hostmaster@example.com
      # To inspect the active value: docker exec <traefik-container> env | grep ACME_EMAIL
      storage: /certs/acme.json
      tlsChallenge: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

metrics:
  prometheus:
    entryPoint: admin
