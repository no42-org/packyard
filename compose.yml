services:

  traefik:
    image: traefik:3.6.12
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE        # bind port 443
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /plugins-storage        # Traefik always initialises this dir at startup
      - /tmp                    # Go runtime scratch
    ports:
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/certs
    environment:
      # Static config (traefik.yml) does not expand ${VAR}; use the TRAEFIK_ env var prefix instead.
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL:?ACME_EMAIL must be set in .env}
      # Passed into file-provider Go templates via {{ env "PKG_DOMAIN" }} in dynamic/*.yml
      - PKG_DOMAIN=${PKG_DOMAIN:?PKG_DOMAIN must be set in .env}
      # Admin UI host — Traefik routes Host(${ADMIN_DOMAIN}) to the auth service
      # over public TLS. ACME issues a cert for this name; ops sets it in .env.
      # The auth service uses the SAME value via PACKYARD_ADMIN_HOST for CSRF.
      - ADMIN_DOMAIN=${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set in .env}
    networks:
      - proxy

  auth:
    image: ghcr.io/no42-org/packyard-auth:0.3.1-rc
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp                    # Go runtime scratch
    expose:
      - "9090"  # Prometheus metrics — internal Docker network only, not published to host
    environment:
      - RPM_DATA_ROOT=/data/rpm
      # § 7 / D15 — admin host the browser uses for the SPA. Used by the CSRF
      # guard to enforce same-origin on /api/v1/* mutations. Derived from
      # ADMIN_DOMAIN so prod stays a single source of truth.
      - PACKYARD_ADMIN_HOST=https://${ADMIN_DOMAIN:?ADMIN_DOMAIN must be set in .env}
      # Operator bootstrap and OAuth providers — values come from .env. Compose
      # only uses .env for interpolation, so each variable must be forwarded
      # explicitly here to reach the container. `${VAR:-}` forwards an unset
      # variable as empty; the auth service treats an empty provider group or
      # bootstrap email as "not configured".
      - PACKYARD_BOOTSTRAP_OPERATOR_EMAIL=${PACKYARD_BOOTSTRAP_OPERATOR_EMAIL:-}
      - PACKYARD_GITHUB_CLIENT_ID=${PACKYARD_GITHUB_CLIENT_ID:-}
      - PACKYARD_GITHUB_CLIENT_SECRET=${PACKYARD_GITHUB_CLIENT_SECRET:-}
      - PACKYARD_GITHUB_REDIRECT_URI=${PACKYARD_GITHUB_REDIRECT_URI:-}
      - PACKYARD_GITHUB_ORG=${PACKYARD_GITHUB_ORG:-}
      - PACKYARD_MICROSOFT_CLIENT_ID=${PACKYARD_MICROSOFT_CLIENT_ID:-}
      - PACKYARD_MICROSOFT_CLIENT_SECRET=${PACKYARD_MICROSOFT_CLIENT_SECRET:-}
      - PACKYARD_MICROSOFT_REDIRECT_URI=${PACKYARD_MICROSOFT_REDIRECT_URI:-}
      - PACKYARD_MICROSOFT_TENANT_ID=${PACKYARD_MICROSOFT_TENANT_ID:-}
      # Public-component cache TTL for forward-auth. Unset or empty = 30s
      # default; "0" disables. See docs/reference/configuration.md.
      - PACKYARD_PUBLIC_COMPONENT_CACHE_TTL=${PACKYARD_PUBLIC_COMPONENT_CACHE_TTL:-}
    volumes:
      - auth-db:/data/db
      - auth-backup:/data/backup
      - rpm-data:/data/rpm
    healthcheck:
      test: ["CMD", "/auth", "-health-check"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy    # receives forwardAuth calls from Traefik; admin UI + API routed via the websecure entrypoint by Host(ADMIN_DOMAIN) rule
      - backend  # promotion pipeline access (Epic 4); placed here now to complete isolation topology
    # KNOWN GAP: admin and subscriber traffic share the same listen socket
    # (`auth:8080`). The auth handler distinguishes them by Host/path. A
    # future hardening pass should add a second listener (e.g. :8081) bound
    # to a dedicated admin network so a compromised subscriber-serving
    # container cannot reach admin endpoints at the network layer. Tracked
    # in deferred-work.md (PR #101 round 2, D2-4).

  aptly:
    image: ghcr.io/no42-org/packyard-aptly:1.6.2
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /root                   # GPG writes ~/.gnupg at promotion exec time; keys are re-imported each run
      - /tmp                    # GPG temp files
    volumes:
      - aptly-data:/opt/aptly
      - ./aptly/aptly.conf:/etc/aptly.conf:ro
      - ./aptly/scripts:/scripts:ro
    networks:
      - backend  # promotion-only; not Traefik-proxied for subscribers

  deb:
    image: nginx:alpine
    restart: unless-stopped
    user: "101:101"             # run directly as nginx user — no privilege drop, no cap_add needed
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # uid=/gid= tmpfs options require Docker Engine >= 20.10; silently ignored on older engines
      # and Podman rootless, which would reproduce the EACCES failure at nginx startup.
      - /run:uid=101,gid=101                    # nginx PID and lock files
      - /var/cache/nginx:uid=101,gid=101        # client/proxy/fastcgi temp dirs
    volumes:
      - aptly-data:/opt/aptly/public:ro
      - ./deb/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy

  rpm:
    image: ghcr.io/no42-org/packyard-rpm:0.3.1-rc
    restart: unless-stopped
    user: "101:101"             # run directly as nginx user — no privilege drop, no cap_add needed
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:uid=101,gid=101                    # nginx PID and lock files
      - /var/cache/nginx:uid=101,gid=101        # client/proxy/fastcgi temp dirs
    volumes:
      - rpm-data:/usr/share/nginx/html  # rw — init script creates directory tree on first start
    networks:
      - proxy

  zot:
    image: ghcr.io/project-zot/zot-linux-amd64:v2.1.2
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp                    # Go runtime and OCI layer push scratch
    command: serve /etc/zot/config.json
    ports:
      - "127.0.0.1:5000:5000"  # loopback-only — GHA workflows access via SSH tunnel (Story 4.4)
    volumes:
      - zot-data:/var/lib/registry
      - ./zot/config.json:/etc/zot/config.json:ro
    networks:
      - proxy

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /logs                   # RustFS hardcodes RUSTFS_OBS_LOG_DIRECTORY=/logs; mkdir -p at startup
    ports:
      - "127.0.0.1:9000:9000"  # loopback-only — GHA workflows access via SSH tunnel (Story 4.1)
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
    env_file: ./rustfs/config.env
    volumes:
      - rustfs-data:/data
    command: ["/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend  # promotion-only; not Traefik-proxied for subscribers

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /root                   # AWS CLI writes ~/.aws credential cache at runtime
      - /tmp                    # AWS CLI scratch files
    environment:
      - AWS_ACCESS_KEY_ID=${RUSTFS_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${RUSTFS_SECRET_KEY}
    entrypoint: >
      sh -c "aws --endpoint-url http://rustfs:9000 s3 mb s3://staging --region us-east-1 || true &&
             echo 'Staging bucket ready'"
    networks:
      - backend

  backup:
    image: ghcr.io/no42-org/packyard-backup:3.53.4
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp                    # SQLite scratch space
    volumes:
      - auth-db:/data/db:ro
      - auth-backup:/backup
    entrypoint: ["/bin/sh", "-c", "while true; do /scripts/backup-keystore.sh; sleep 86400; done"]
    networks:
      - backend

  static:
    image: ghcr.io/no42-org/packyard-static:0.3.1-rc
    restart: unless-stopped
    user: "101:101"             # run directly as nginx user — no privilege drop, no cap_add needed
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:uid=101,gid=101                    # nginx PID and lock files
      - /var/cache/nginx:uid=101,gid=101        # client/proxy/fastcgi temp dirs
    networks:
      - proxy

networks:
  proxy:
    # Traefik + package-serving backends + auth (for forwardAuth).
    # Services on this network are reachable by Traefik for proxying.
    # rustfs and aptly are intentionally excluded — they are promotion-only (Epic 4).
  backend:
    # Promotion pipeline and key store infrastructure.
    # auth is on both proxy and backend to receive forwardAuth calls AND manage keys.
    # Not routed by Traefik for subscriber requests.

volumes:
  aptly-data:
  rpm-data:
  zot-data:
  rustfs-data:
  auth-db:
  auth-backup:
  traefik-certs:
