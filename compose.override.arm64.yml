# compose.override.arm64.yml — Apple Silicon (arm64) overrides
#
# Swaps zot to the arm64 image variant. aptly is published as a multi-arch
# image to ghcr.io and selects the correct binary automatically.
#
# Usage:
#   docker compose -f compose.yml \
#                  -f compose.override.ci.yml \
#                  -f compose.override.arm64.yml \
#                  up -d

services:
  zot:
    image: ghcr.io/project-zot/zot-linux-arm64:v2.1.2@sha256:c3fc47782d98b731d5928a24182b495e28cc92f9dcf1d5317f7dbd632e10bf30
