name: Integration

# Full-stack end-to-end run: brings the compose stack up with the CI override
# (plain HTTP, ports published to the runner), seeds an operator session and
# test data through the real admin API, publishes an RPM, a DEB and a
# multi-arch image through the same scripts production promotions use, and
# runs the four e2e suites. All steps call Makefile targets so the same
# commands work locally.

on:
  pull_request:
    paths:
      - 'compose.yml'
      - 'compose.override.ci.yml'
      - 'traefik/**'
      - 'auth/**'
      - 'rpm/**'
      - 'static/**'
      - 'backup/**'
      - 'aptly/**'
      - 'deb/**'
      - 'zot/**'
      - 'rustfs/**'
      - 'scripts/backup-keystore.sh'
      - 'tests/e2e/**'
      - 'scripts/ci/**'
      - 'Makefile'
      - '.github/workflows/integration.yml'
  push:
    branches: [main]
    paths:
      - 'compose.yml'
      - 'compose.override.ci.yml'
      - 'traefik/**'
      - 'auth/**'
      - 'rpm/**'
      - 'static/**'
      - 'backup/**'
      - 'aptly/**'
      - 'deb/**'
      - 'zot/**'
      - 'rustfs/**'
      - 'scripts/backup-keystore.sh'
      - 'tests/e2e/**'
      - 'scripts/ci/**'
      - 'Makefile'
      - '.github/workflows/integration.yml'
  schedule:
    - cron: '17 4 * * 1'   # weekly, so a broken stack is noticed even without stack changes
  workflow_dispatch:

permissions:
  contents: read

# One run per event and ref. Never cancel: a post-merge run that is cancelled
# by the next merge leaves that commit without a verdict and skips the log dump.
concurrency:
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPOSE_PROJECT_NAME: packyard-ci
  COMPOSE_FILE: compose.yml:compose.override.ci.yml

jobs:

  integration:
    name: Full stack + observability
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write  # cosign keyless signing of the OCI fixture (push and schedule only)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Create CI .env
        # Every ${VAR:?} guard in compose.yml must be satisfied. Hostnames are
        # placeholders: the CI Traefik config routes by path, not by host. The
        # seed script derives its Origin header from ADMIN_DOMAIN via compose.
        run: |
          cat > .env <<'EOF'
          ACME_EMAIL=ci@example.com
          PKG_DOMAIN=pkg.ci.local
          ADMIN_DOMAIN=admin.ci.local
          RUSTFS_ACCESS_KEY=ci-access-key
          RUSTFS_SECRET_KEY=ci-secret-key-value
          PACKYARD_BOOTSTRAP_OPERATOR_EMAIL=ci-operator@example.org
          EOF

      - name: Install subscriber tooling
        # dnf and rpm for the RPM test and rpmsign; crane and cosign for the
        # OCI fixture and test. apt-get, docker and gpg are on the runner.
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dnf rpm
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" -o /tmp/crane.tar.gz
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/crane.tar.gz -C /tmp crane && sudo mv /tmp/crane /usr/local/bin/crane

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Generate the run's signing key
        run: make ci-signing-key

      - name: Start stack
        run: make ci-stack-up

      - name: Verify environment passthrough and compose guards
        run: make ci-verify-env

      - name: Seed operator session, components, account and key
        # Admin host and bootstrap email are read from `docker compose config`,
        # so they always match what the auth container was started with.
        run: make ci-seed

      - name: Publish fixtures through the shared publish scripts
        # Signed keylessly on push and schedule; pull requests (forks have no
        # usable OIDC token) publish unsigned and skip the signature check.
        env:
          COSIGN_SIGN: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          OWN_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/integration.yml@${{ github.ref }}
        run: make ci-publish-fixtures

      - name: Run observability tests (AC1–AC4)
        run: make e2e-observability

      - name: Run RPM subscriber test
        # dnf and apt-get install into a private root, which still needs root.
        # -E keeps COMPOSE_* and the seeded key visible to the make target.
        run: sudo -E make e2e-rpm

      - name: Run DEB subscriber test
        run: sudo -E make e2e-deb

      - name: Run OCI subscriber test
        env:
          COSIGN_SKIP: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: make e2e-oci

      - name: Dump service logs on failure
        if: failure()
        run: make ci-stack-logs

      - name: Tear down stack
        if: always()
        run: make ci-stack-down
