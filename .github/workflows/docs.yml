name: Docs

# Publishes the Docusaurus site at
# https://no42-org.github.io/packyard/ on every push to main. Toolchain
# and Node version are pinned via package-lock.json and .nvmrc respectively.
#
# First-deploy manual step: after this workflow succeeds for the first time
# following the Docusaurus migration, a maintainer must confirm the GitHub
# Pages source is still set to the `gh-pages` branch in Settings -> Pages.
# The previous MkDocs + mike deployment also targeted `gh-pages`; the
# peaceiris action with `force_orphan: true` rewrites the branch on first
# run, wiping the mike-versioned subdirectories.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docusaurus.config.ts'
      - 'sidebars.ts'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'tsconfig.json'
      - '.github/workflows/docs.yml'
      - 'Makefile'
  # The Release workflow dispatches this workflow after publishing images so
  # the landing-page hero eyebrow (version resolved at build time in
  # docusaurus.config.ts) picks up the newly pushed tag.
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # deploy action needs history to push to gh-pages

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install docs toolchain
        run: make docs-install

      - name: Verify strict build
        run: make docs-build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
