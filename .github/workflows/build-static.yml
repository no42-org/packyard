name: Build and publish static image

on:
  push:
    tags:
      - 'v*.*.*'
    branches: [main]
    paths:
      - static/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/packyard-static

jobs:

  build-and-push:
    name: Build multi-arch and push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "${IMAGE}" "${ver}" "${IMAGE}" >> "${GITHUB_OUTPUT}"
          else
            ver=$(cat static/VERSION)
            printf 'tags<<EOF\n%s:%s\nEOF\n' "${IMAGE}" "${ver}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU (cross-platform builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ./static
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
