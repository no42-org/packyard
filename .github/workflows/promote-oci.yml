name: Promote OCI

on:
  workflow_dispatch:
    inputs:
      component:
        description: "LTS component name (must be provisioned via POST /api/v1/components)"
        required: true
      series:
        description: "LTS series (e.g. 2025)"
        required: true

env:
  AWS_DEFAULT_REGION: us-east-1
  RUSTFS_ENDPOINT: http://localhost:9000
  ZOT_REGISTRY: localhost:5000

concurrency:
  group: oci-promote-${{ inputs.component }}-${{ inputs.series }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install crane
        env:
          CRANE_VERSION: v0.20.2
          CRANE_SHA256: c14340087103ba9dadf61d45acd20675490fd0ccbd56ac7901fc1b502137f44b
        run: |
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            -o /tmp/crane.tar.gz
          echo "${CRANE_SHA256}  /tmp/crane.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/crane.tar.gz -C /tmp crane
          sudo mv /tmp/crane /usr/local/bin/crane
          crane version

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOST }}" >> ~/.ssh/known_hosts

      - name: Open tunnels (RustFS + Zot)
        run: |
          ssh -fN -L 9000:localhost:9000 deploy@${{ secrets.HOST }}
          timeout 15 bash -c 'until nc -z localhost 9000 2>/dev/null; do sleep 1; done'
          ssh -fN -L 5000:localhost:5000 deploy@${{ secrets.HOST }}
          timeout 15 bash -c 'until nc -z localhost 5000 2>/dev/null; do sleep 1; done'

      - name: Download OCI archives from RustFS
        env:
          COMPONENT: ${{ inputs.component }}
          SERIES: ${{ inputs.series }}
          RUSTFS_ACCESS_KEY: ${{ secrets.RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ secrets.RUSTFS_SECRET_KEY }}
        run: |
          mkdir -p ./staging/x86_64 ./staging/arm64
          for arch in x86_64 arm64; do
            AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
              aws s3 sync \
                "s3://staging/${COMPONENT}/${SERIES}/oci/${arch}/" \
                "./staging/${arch}/" \
                --endpoint-url "$RUSTFS_ENDPOINT"
          done

      - name: Verify checksums
        run: |
          for arch in x86_64 arm64; do
            # Ensure every archive has a paired .sha256
            for tar in "./staging/${arch}"/*.tar; do
              [ -f "$tar" ] || { echo "No .tar files found in staging/${arch}/"; exit 1; }
              [ -f "${tar}.sha256" ] || { echo "MISSING CHECKSUM: ${tar}.sha256 not found"; exit 1; }
            done
            # Verify each checksum
            for sha in "./staging/${arch}"/*.sha256; do
              [ -f "$sha" ] || { echo "No .sha256 files found in staging/${arch}/"; exit 1; }
              expected=$(cat "$sha")
              file="${sha%.sha256}"
              [ -f "$file" ] || { echo "MISSING: $file referenced by $sha"; exit 1; }
              actual=$(sha256sum "$file" | awk '{print $1}')
              if [ "$expected" != "$actual" ]; then
                echo "CHECKSUM MISMATCH: $file"
                exit 1
              fi
              echo "OK: $file"
            done
          done

      - name: Push images to Zot
        env:
          COMPONENT: ${{ inputs.component }}
          SERIES: ${{ inputs.series }}
        run: |
          IMAGE_BASE="${ZOT_REGISTRY}/lts-${COMPONENT}"
          for arch in x86_64 arm64; do
            tarcount=$(find "./staging/${arch}" -maxdepth 1 -name '*.tar' 2>/dev/null | wc -l)
            [ "$tarcount" -eq 1 ] || { echo "Expected exactly 1 .tar for ${arch}, found ${tarcount}"; exit 1; }
            tarfile=$(ls ./staging/${arch}/*.tar)
            crane push "$tarfile" "${IMAGE_BASE}:${SERIES}-${arch}" --insecure
            echo "Pushed: ${IMAGE_BASE}:${SERIES}-${arch}"
          done

      - name: Create multi-arch image index
        env:
          COMPONENT: ${{ inputs.component }}
          SERIES: ${{ inputs.series }}
        run: |
          IMAGE_BASE="${ZOT_REGISTRY}/lts-${COMPONENT}"
          crane index append \
            --tag "${IMAGE_BASE}:${SERIES}" \
            --manifest "${IMAGE_BASE}:${SERIES}-x86_64" \
            --manifest "${IMAGE_BASE}:${SERIES}-arm64" \
            --insecure
          echo "Index created: ${IMAGE_BASE}:${SERIES}"

      - name: Sign images with cosign (ephemeral)
        env:
          COMPONENT: ${{ inputs.component }}
          SERIES: ${{ inputs.series }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_BASE="${ZOT_REGISTRY}/lts-${COMPONENT}"
          for tag in "${SERIES}-x86_64" "${SERIES}-arm64" "${SERIES}"; do
            cosign sign \
              --key env://COSIGN_PRIVATE_KEY \
              --allow-insecure-registry \
              --tlog-upload=false \
              --yes \
              "${IMAGE_BASE}:${tag}"
            echo "Signed: ${IMAGE_BASE}:${tag}"
          done

      - name: Verify cosign signature (sanity check)
        env:
          COMPONENT: ${{ inputs.component }}
          SERIES: ${{ inputs.series }}
        run: |
          grep -q 'BEGIN PUBLIC KEY' ./static/content/gpg/cosign.pub \
            || { echo "ERROR: cosign.pub is still a placeholder — replace with real key before promoting"; exit 1; }
          IMAGE_BASE="${ZOT_REGISTRY}/lts-${COMPONENT}"
          if cosign verify \
            --key ./static/content/gpg/cosign.pub \
            --allow-insecure-registry \
            --insecure-ignore-tlog \
            "${IMAGE_BASE}:${SERIES}"; then
            echo "SIGNATURE VERIFIED"
          else
            echo "SIGNATURE VERIFICATION FAILED"; exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -f /tmp/cosign.key
          pkill -f 'ssh -fN -L 9000' || true
          pkill -f 'ssh -fN -L 5000' || true
