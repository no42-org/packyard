name: Build and publish rpm image

on:
  push:
    tags:
      - 'v*.*.*'
    branches: [main]
    paths:
      - rpm/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/packyard-rpm

jobs:

  build-and-push:
    name: Build multi-arch and push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Determine image version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            printf 'tags<<EOF\n%s:%s\n%s:latest\nEOF\n' "${IMAGE}" "${ver}" "${IMAGE}" >> "${GITHUB_OUTPUT}"
          else
            ver=$(cat rpm/VERSION)
            printf 'tags<<EOF\n%s:%s\nEOF\n' "${IMAGE}" "${ver}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU (cross-platform builds)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: ./rpm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
