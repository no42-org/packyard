version: 2

updates:

  # Go modules — auth service
  - package-ecosystem: gomod
    directory: /auth
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go

  # GitHub Actions — workflow action versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions

  # Docker base images — service Dockerfiles only (auth, rpm, backup, aptly, static).
  # Images declared in compose.yml are not scanned by Dependabot's docker ecosystem,
  # and the repository root has no Dockerfile.
  - package-ecosystem: docker
    directory: /auth
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /rpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /aptly
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /static
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  # npm — Docusaurus docs toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    # react and react-dom must be the exact same version; keep them in one PR
    groups:
      # all @docusaurus/* packages must be the exact same version
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # npm — admin UI SPA embedded in the auth service
  - package-ecosystem: npm
    directory: /auth/internal/admin-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react pins a vite major via peerDependencies; bump together
      vite:
        patterns:
          - vite
          - "@vitejs/*"
