version: 2

updates:

  # Go modules — auth service
  - package-ecosystem: gomod
    directory: /auth
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go

  # GitHub Actions — workflow action versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  # Docker base images — service Dockerfiles only
  # Note: images declared in compose.yml are not scanned by Dependabot's docker ecosystem
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /auth
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /rpm
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  # npm — Docusaurus docs toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - npm
    # react and react-dom must be the exact same version; keep them in one PR
    groups:
      # all @docusaurus/* packages must be the exact same version
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
