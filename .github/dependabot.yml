version: 2

updates:

  # Go modules — auth service
  - package-ecosystem: gomod
    directory: /auth
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - go

  # GitHub Actions — workflow action versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - github-actions

  # Container images declared in compose.yml. `docker-compose` is a separate
  # ecosystem from `docker`, generally available since February 2025. Its file
  # matcher is /(docker-)?compose(-\w+)?(\.[\w-]+)?\.ya?ml/, which covers
  # compose.yml but not compose.override.<name>.yml; scripts/lint-image-pins.sh
  # keeps the arm64 override's Zot pin in step and rejects any unpinned image.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker
    ignore:
      # First-party images. Their tag is written by the release process
      # (RELEASING.md § 1), never by a bot.
      - dependency-name: "ghcr.io/no42-org/packyard-*"

  # Docker base images — service Dockerfiles (auth, rpm, backup, aptly, static).
  # The repository root has no Dockerfile, so each service gets its own entry.
  - package-ecosystem: docker
    directory: /auth
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /rpm
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /backup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /aptly
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /static
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - docker

  # npm — Docusaurus docs toolchain
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    # react and react-dom must be the exact same version; keep them in one PR
    groups:
      # all @docusaurus/* packages must be the exact same version
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # npm — admin UI SPA embedded in the auth service
  - package-ecosystem: npm
    directory: /auth/internal/admin-ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - npm
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # @vitejs/plugin-react pins a vite major via peerDependencies; bump together
      vite:
        patterns:
          - vite
          - "@vitejs/*"
