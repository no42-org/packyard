site_name: Packyard
site_description: Authenticated package distribution for LTS releases
site_url: https://no42-org.github.io/packyard/
repo_name: no42-org/packyard
repo_url: https://github.com/no42-org/packyard
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started: getting-started/quick-start.md
  - Operations:
    - Production Deployment: ops/production-deployment.md
    - Release Runbook: ops/release-runbook.md
    - Restore Keystore: ops/restore-keystore.md
    - Manual Test Plan: ops/manual-test-plan.md
    - Troubleshooting: ops/troubleshooting.md
  - Reference:
    - Architecture: reference/architecture.md
    - Subscriber Usage: reference/subscriber-usage.md
    - Admin API: reference/api.md
    - Promotion Pipeline: reference/promotion-pipeline.md
    - Observability: reference/observability.md
    - Configuration: reference/configuration.md

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: latest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
